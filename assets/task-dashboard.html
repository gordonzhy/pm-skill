    tbody tr.dependency-target, tbody tr.task-focus { background:#214359; box-shadow:inset 4px 0 0 var(--accent); }
    tbody tr.task-group-heading td { background:#1b344b; color:#b9dce9; font-weight:750; text-transform:uppercase; letter-spacing:.08em; }
    tbody tr.task-group-heading.confirm-group td { background:#15445d; color:#a3eff8; border-top-color:#58d9ed; }
    .badge { background:#26374a; color:#d6e9f3; }
    .status-todo { --tag-border:#5875ab; } .status-active { --tag-border:#b58b4b; }
    .status-confirm { --tag-border:#3ba4bf; } .status-blocked { --tag-border:#b96277; }
    .status-completed { --tag-border:#4d9f7c; } .status-cancelled { --tag-border:#667b91; }
    .status-unknown { --tag-border:#667b91; }
    .runtime-registered { background:#173d56; color:#89d9f1; border-color:#3e8dab; }
    .runtime-running { background:#153d36; color:#79e2b8; border-color:#448c72; }
    .runtime-waiting,.recovery-pending { background:#40331b; color:#ffcf75; border-color:#af8747; }
    .runtime-idle,.runtime-ended,.runtime-none { background:#273344; color:#afc2d4; border-color:#536b82; }
    .runtime-interrupted,.runtime-unknown,.runtime-stale { background:#482631; color:#ff9eaa; border-color:#ac6475; }
    .recovery-sent { background:#332c50; color:#c9b0ff; border-color:#7566a8; }
    .dependency-chip { border-color:#4c6881; background:#1a3449; color:#c6e1ed; }
    .dependency-chip:hover,.dependency-chip:focus-visible { background:#22516a; color:#b6f4ff; }
    time { border-bottom-color:#7794aa; }
    .empty { color:var(--muted); }
    .graph-task-card { position:fixed; z-index:30; width:min(460px,calc(100vw - 24px)); max-height:min(680px,calc(100vh - 24px)); display:flex; flex-direction:column; overflow:hidden; border:1px solid #4b8199; border-radius:14px; background:#102338; box-shadow:0 20px 60px rgba(0,0,0,.58),0 0 30px rgba(48,170,206,.18); color:var(--ink); }
    .graph-task-card[hidden] { display:none; }
    .graph-card-header { flex:0 0 auto; padding:17px 18px 14px; border-bottom:1px solid var(--line); background:linear-gradient(115deg,#173d55,#102338 74%); }
    .graph-card-top { display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .graph-card-id { color:var(--accent); font:750 12px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.08em; }
    .graph-card-close { appearance:none; width:30px; height:30px; border:1px solid #42667e; border-radius:7px; background:#18384d; color:#d8f3fa; font:22px/1 system-ui,sans-serif; cursor:pointer; }
    .graph-card-close:hover { background:#24516a; }
    .graph-card-title { margin:6px 0 11px; font-size:16px; line-height:1.4; font-weight:740; overflow-wrap:anywhere; }
    .graph-card-meta { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px 12px; color:#a9c6d8; font-size:12px; }
    .graph-card-meta span { overflow-wrap:anywhere; }
    .graph-card-meta strong { color:#e8f5ff; font-weight:650; }
    .graph-card-detail { min-height:56px; overflow:auto; padding:7px 18px 17px; scrollbar-color:#42647d #102338; }
    .graph-card-detail h3 { margin:16px 0 6px; color:#83e0ed; font-size:13px; font-weight:720; }
    .graph-card-detail h4 { margin:13px 0 5px; color:#c1e6f0; font-size:12px; }
    .graph-card-detail p { margin:0 0 7px; color:#c9dbe7; font-size:12px; line-height:1.62; overflow-wrap:anywhere; white-space:pre-wrap; }
    .graph-card-detail p.bullet { padding-left:12px; text-indent:-12px; }
    .graph-card-detail p.quote { padding-left:9px; border-left:2px solid #5a9bb3; color:#a8c9d7; }
    .graph-card-footer { display:flex; align-items:center; justify-content:space-between; gap:8px; flex:0 0 auto; padding:10px 18px; border-top:1px solid var(--line); color:#8daabd; font-size:11px; }
    .graph-card-footer button,.task-file-button { appearance:none; padding:0; border:0; background:transparent; color:#85e2f0; font:inherit; font-weight:650; cursor:pointer; text-align:left; }
    .graph-card-footer button:hover,.task-file-button:hover { color:#c7f8ff; text-decoration:underline; }
    .task-modal { width:min(920px,calc(100vw - 28px)); max-width:none; height:min(88vh,920px); max-height:none; padding:0; border:1px solid #4b8199; border-radius:16px; background:#0e2033; color:var(--ink); box-shadow:0 32px 90px rgba(0,0,0,.7),0 0 42px rgba(48,170,206,.14); overflow:hidden; }
    .task-modal::backdrop { background:rgba(2,9,18,.78); backdrop-filter:blur(5px); }
    .task-modal[open] { display:flex; flex-direction:column; }
    .task-modal-header { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; flex:0 0 auto; padding:20px clamp(18px,3vw,32px); border-bottom:1px solid var(--line); background:linear-gradient(110deg,#173e57,#0e2033 72%); }
    .task-modal-kicker { color:var(--accent); font:750 11px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.12em; }
    .task-modal-title { margin:7px 0 4px; font-size:clamp(20px,2vw,27px); line-height:1.3; overflow-wrap:anywhere; }
    .task-modal-subtitle { margin:0; color:#a6c5d7; font-size:12px; overflow-wrap:anywhere; }
    .task-modal-close { appearance:none; flex:0 0 auto; width:34px; height:34px; border:1px solid #4d7088; border-radius:8px; background:#173a51; color:#e5f7fb; font:24px/1 system-ui,sans-serif; cursor:pointer; }
    .task-modal-close:hover { background:#24536d; }
    .task-markdown { flex:1 1 auto; overflow:auto; padding:22px clamp(18px,3vw,34px) 34px; scrollbar-color:#42647d #0e2033; font-size:14px; line-height:1.72; }
    .task-markdown h2,.task-markdown h3,.task-markdown h4,.task-markdown h5 { color:#dff6fb; line-height:1.35; }
    .task-markdown h2 { margin:0 0 16px; font-size:21px; }
    .task-markdown h3 { margin:28px 0 10px; padding-bottom:7px; border-bottom:1px solid #294b62; color:#91e5f0; font-size:17px; }
    .task-markdown h4 { margin:20px 0 7px; color:#c1e9f1; font-size:15px; }
    .task-markdown h5 { margin:16px 0 6px; font-size:14px; }
    .task-markdown p { margin:0 0 13px; color:#d0e0eb; overflow-wrap:anywhere; }
    .task-markdown ul,.task-markdown ol { margin:0 0 16px; padding-left:24px; color:#d0e0eb; }
    .task-markdown li { margin:0 0 7px; padding-left:2px; overflow-wrap:anywhere; }
    .task-markdown li::marker { color:#65d8e9; }
    .task-markdown strong { color:#f1f9fc; }
    .task-markdown code { padding:1px 5px; border:1px solid #35536b; border-radius:4px; background:#1a3449; color:#a3e9f2; font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; overflow-wrap:anywhere; }
    .task-markdown pre { overflow:auto; margin:0 0 16px; padding:14px; border:1px solid #35536b; border-radius:8px; background:#091727; }
    .task-markdown pre code { padding:0; border:0; background:transparent; color:#d6e8f2; white-space:pre; }
    .task-markdown blockquote { margin:0 0 16px; padding:3px 0 3px 14px; border-left:3px solid #64cce1; color:#abc9d9; }
    .task-markdown blockquote p { margin:0; }
    .task-markdown a { color:#82e3f0; text-underline-offset:3px; }
    .task-markdown .md-local-path { color:#b0c9d9; }
    .task-markdown .md-local-path code { margin-left:4px; }
    .task-markdown table { width:100%; min-width:0; margin:0 0 18px; border-collapse:collapse; }
    .task-markdown th,.task-markdown td { position:static; padding:8px 10px; border:1px solid #35536b; background:transparent; white-space:normal; }
    .task-markdown th { background:#18384c; color:#dff6fb; }
    .task-markdown hr { border:0; border-top:1px solid #35536b; margin:20px 0; }
    body.task-modal-open { overflow:hidden; }
    @media (max-width:600px) { .task-modal { width:100vw; height:100dvh; max-height:none; border:0; border-radius:0; } .task-modal-header { padding:18px; } .task-markdown { padding:18px; } }
    @media (max-width:1120px) { .summary { grid-template-columns:repeat(3,minmax(0,1fr)); } }
    @media (max-width:700px) { main { padding:20px 12px 36px; } .summary { grid-template-columns:repeat(2,minmax(0,1fr)); } .card { min-height:112px; padding:14px; } .page-header { padding-bottom:20px; } .dashboard-brand { gap:12px; } .dashboard-logo { flex-basis:46px; width:46px; height:46px; } }
    @media (max-width:390px) { .summary { gap:8px; } .card { min-height:108px; } .count { font-size:30px; } }
    @media (prefers-reduced-motion:reduce) { .card { transition:none; } }
    .task-type { margin-left:5px; border:1px solid currentColor; background:transparent; }
    .type-requirement { color:#93c5fd; } .type-design { color:#d8b4fe; } .type-development { color:#67e8f9; } .type-test { color:#86efac; } .type-deployment { color:#fcd34d; } .type-management { color:#fda4af; } .type-unknown { color:#cbd5e1; }
    .graph-node text.graph-type { font-size:10px; fill:currentColor; } .graph-muted { opacity:.25; }
    .testing-summary { padding:9px; border:1px solid var(--line); margin-bottom:10px; }
  html.embedded-task-detail,html.embedded-task-detail body{background:transparent;margin:0;padding:0;overflow:hidden;min-height:0}
html.embedded-task-detail body>:not(#task-modal):not(#embedded-detail-status){display:none!important}
html.embedded-task-detail #task-modal{position:static;inset:auto;margin:0;width:100%;height:100dvh;max-height:none;border:0;border-radius:0;box-shadow:none}
#embedded-detail-status{padding:24px;color:#bdd1e1;font:14px/1.7 system-ui}
{{TASK_LOG_CSS}}
</style>
</head>
<body>
<main>
  <header class="page-header">
    <div class="dashboard-brand">
      {{DASHBOARD_LOGO}}
      <div class="dashboard-brand-copy">
        <div class="eyebrow">PROJECT OPERATIONS / TASK CONTROL</div>
        <h1>{{DASHBOARD_TITLE}}</h1>
        <p class="source">任务真源：<a href="TASKS.csv">TASKS.csv</a>；会话状态来自全局可重建观察缓存。数据变化时自动更新。</p>
      </div>
    </div>
  </header>
  <div class="notification-permission" id="notification-permission" hidden>
    <span id="notification-permission-text" role="status" aria-live="polite">开启浏览器通知，待确认任务出现时提醒你。</span>
    <button id="enable-notifications" type="button">开启通知</button>
  </div>
  <div class="section-caption">项目态势 · TASK POSTURE</div>
  <section class="summary" id="posture-summary" aria-label="当前任务态势汇总">
    <button class="card confirm" type="button" data-execution="confirm" aria-pressed="false"><h2>待确认</h2><div class="count">{{CONFIRM_COUNT}}</div><div class="ids">{{CONFIRM_IDS}}</div></button>
    <button class="card active" type="button" data-execution="active" aria-pressed="false"><h2>进行中</h2><div class="count">{{ACTIVE_COUNT}}</div><div class="ids">{{ACTIVE_IDS}}</div></button>
    <button class="card ready" type="button" data-execution="ready" aria-pressed="false"><h2>可开始</h2><div class="count">{{READY_COUNT}}</div><div class="ids">{{READY_IDS}}</div></button>
    <button class="card waiting" type="button" data-execution="waiting" aria-pressed="false"><h2>等待依赖</h2><div class="count">{{WAITING_COUNT}}</div><div class="ids">{{WAITING_IDS}}</div></button>
    <button class="card blocked" type="button" data-execution="blocked" aria-pressed="false"><h2>受阻</h2><div class="count">{{BLOCKED_COUNT}}</div><div class="ids">{{BLOCKED_IDS}}</div></button>
  </section>
  <section class="filters" aria-label="组合筛选">
    <label>关键词<input id="keyword" type="search" placeholder="ID、标题、执行者、依赖……"></label>
    <label>状态<select id="status"><option value="active-set">全部进行中</option><option value="">全部任务</option>{{STATUS_OPTIONS}}</select></label>
    <label>类型<select id="task-type"><option value="">全部</option><option>需求</option><option>设计</option><option>开发</option><option>测试</option><option>部署</option><option>管理</option><option>未分类</option></select></label>
    <label>边界<select id="boundary"><option value="">全部</option>{{BOUNDARY_OPTIONS}}</select></label>
    <label>优先级<select id="priority"><option value="">全部</option>{{PRIORITY_OPTIONS}}</select></label>
    <label>任务态势<select id="execution"><option value="">全部</option><option value="active">进行中</option><option value="ready">可开始</option><option value="waiting">等待依赖</option><option value="confirm">待确认</option><option value="blocked">受阻</option></select></label>
    <label>执行会话<select id="execution-runtime"><option value="">全部</option><option value="none">未登记</option><option value="running">运行中</option><option value="waiting">等待输入或审批</option><option value="idle">已停止</option><option value="interrupted">已中断</option><option value="ended">会话结束</option><option value="stale">状态过期</option><option value="unknown">状态未知</option></select></label>
    <label>项目经理会话<select id="manager-runtime"><option value="">全部</option><option value="none">未登记</option><option value="running">运行中</option><option value="waiting">等待输入或审批</option><option value="idle">已停止</option><option value="interrupted">已中断</option><option value="ended">会话结束</option><option value="stale">状态过期</option><option value="unknown">状态未知</option></select></label>
    <label>恢复通知<select id="recovery-state"><option value="">全部</option><option value="none">未触发</option><option value="pending">待发送</option><option value="sent">已发送</option></select></label>
    <button class="reset" id="reset" type="button">重置</button>
  </section>
  <section class="dependency-graph-panel" id="dependency-graph-panel" aria-labelledby="dependency-graph-title">
    <div class="graph-heading">
      <div class="graph-title">
        <h2 id="dependency-graph-title">任务依赖图</h2>
        <p class="graph-hint" id="graph-hint" aria-live="polite">悬停或聚焦节点查看预览；点击或按Enter/空格打开任务详情</p>
      </div>
      <div class="graph-controls" aria-label="依赖图显示选项">
        <div class="graph-zoom-controls" role="group" aria-label="依赖图缩放">
          <button class="graph-control" id="graph-zoom-out" type="button" aria-label="缩小依赖图">−</button>
          <button class="graph-control graph-zoom-value" id="graph-zoom-reset" type="button" title="恢复 100%" aria-label="恢复依赖图为 100%">100%</button>
        </div>
        <button class="graph-toggle" id="dependency-graph-toggle" type="button" aria-expanded="true" aria-controls="dependency-graph-body">折叠</button>
      </div>
    </div>
    <div id="dependency-graph-body">
      <div class="graph-scroll"><svg id="dependency-graph" role="img" aria-label="当前筛选任务的依赖关系"></svg></div>
    </div>
  </section>
  <div class="result"><span id="result" aria-live="polite"></span><div class="result-actions"><span>点击列名排序；待确认置顶</span><details class="column-picker" id="column-picker"><summary>显示字段</summary><div class="column-picker-menu" aria-label="选择列表字段">
    <label class="column-option"><input type="checkbox" data-column-toggle value="task_id">ID</label>
    <label class="column-option"><input type="checkbox" data-column-toggle value="status">状态</label>
    <label class="column-option"><input type="checkbox" data-column-toggle value="execution">任务态势</label>
    <label class="column-option"><input type="checkbox" data-column-toggle value="execution_state">执行会话</label>
    <label class="column-option"><input type="checkbox" data-column-toggle value="manager_state">项目经理</label>
    <label class="column-option"><input type="checkbox" data-column-toggle value="recovery_state">恢复通知</label>
    <label class="column-option"><input type="checkbox" data-column-toggle value="priority">优先级</label>
    <label class="column-option"><input type="checkbox" data-column-toggle value="boundary">边界</label>
    <label class="column-option"><input type="checkbox" data-column-toggle value="title">任务</label>
    <label class="column-option"><input type="checkbox" data-column-toggle value="dependencies">依赖</label>
    <label class="column-option"><input type="checkbox" data-column-toggle value="executor">执行者</label>
    <label class="column-option"><input type="checkbox" data-column-toggle value="created_at">创建时间</label>
    <label class="column-option"><input type="checkbox" data-column-toggle value="modified_at">修改时间</label>
    <label class="column-option"><input type="checkbox" data-column-toggle value="detail_path">详情</label>
  </div></details></div></div>
  <div class="table-wrap">
    <table>
      <thead><tr>
        <th data-key="task_id" data-column="task_id"><button type="button" data-sort="task_id">ID</button></th>
        <th data-key="status" data-column="status"><button type="button" data-sort="status">状态</button></th>
        <th data-key="execution" data-column="execution"><button type="button" data-sort="execution" title="由状态与依赖计算；待办任务分为可开始和等待依赖">任务态势</button></th>
        <th data-key="execution_state" data-column="execution_state"><button type="button" data-sort="execution_state">执行会话</button></th>
        <th data-key="manager_state" data-column="manager_state"><button type="button" data-sort="manager_state">项目经理</button></th>
        <th data-key="recovery_state" data-column="recovery_state"><button type="button" data-sort="recovery_state">恢复通知</button></th>
        <th data-key="priority" data-column="priority"><button type="button" data-sort="priority">优先级</button></th>
        <th data-key="boundary" data-column="boundary"><button type="button" data-sort="boundary">边界</button></th>
        <th data-key="title" data-column="title"><button type="button" data-sort="title">任务</button></th>
        <th data-key="dependencies" data-column="dependencies"><button type="button" data-sort="dependencies">依赖</button></th>
        <th data-key="executor" data-column="executor"><button type="button" data-sort="executor">执行者</button></th>
        <th data-key="created_at" data-column="created_at"><button type="button" data-sort="created_at">创建时间</button></th>
        <th data-key="modified_at" data-column="modified_at" aria-sort="descending"><button type="button" data-sort="modified_at">修改时间</button></th>
        <th data-key="detail_path" data-column="detail_path"><button type="button" data-sort="detail_path">详情</button></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty">没有符合当前筛选条件的任务。</div>
  </div>
</main>
<aside class="graph-task-card" id="graph-task-card" aria-label="依赖图任务详情" hidden>
  <div class="graph-card-header">
    <div class="graph-card-top"><span class="graph-card-id" id="graph-card-id"></span><button class="graph-card-close" id="graph-card-close" type="button" aria-label="关闭任务详情">×</button></div>
    <h2 class="graph-card-title" id="graph-card-title"></h2>
    <div class="graph-card-meta" id="graph-card-meta"></div>
  </div>
  <section id="graph-preview-time" class="task-time-panel activity-preview" aria-label="活动时间轴"></section>
  <div class="graph-card-detail" id="graph-card-detail"></div>
  <div class="graph-card-footer"><span>详情来自当前任务文件</span><button id="graph-card-link" type="button">查看完整任务详情</button></div>
</aside>
<dialog class="task-modal" id="task-modal" aria-labelledby="task-modal-title">
  <div class="task-modal-header">
    <div><div class="task-modal-kicker" id="task-modal-id"></div><h2 class="task-modal-title" id="task-modal-title"></h2><p class="task-modal-subtitle" id="task-modal-subtitle"></p></div>
    <button class="task-modal-close" id="task-modal-close" type="button" aria-label="关闭任务详情">×</button>
  </div>
  <section id="task-time-panel" class="task-time-panel" aria-label="任务执行过程"></section>
  <div class="task-detail-tabs" role="tablist" aria-label="任务详情视图">
    <button id="task-description-tab" type="button" role="tab" aria-controls="task-markdown" aria-selected="true" tabindex="0">任务说明</button>
    <button id="task-log-tab" type="button" role="tab" aria-controls="task-log-panel" aria-selected="false" tabindex="-1">任务日志</button>
  </div>
  <article class="task-markdown" id="task-markdown" role="tabpanel" aria-labelledby="task-description-tab" tabindex="0"></article>
  <section id="task-log-panel" class="task-log-panel" role="tabpanel" aria-labelledby="task-log-tab" tabindex="0" hidden></section>
</dialog>
<p id="embedded-detail-status" hidden role="status"></p>
<script>{{TASK_LOG_VENDOR}}</script>
<script>{{TASK_LOG_SCRIPT}}</script>
<script>
let tasks={{TASK_JSON}};
let runtimeSessions=new Map();
let runtimeObservationWarning="";
const labels={active:"进行中",ready:"可开始",waiting:"等待依赖",confirm:"待确认",blocked:"受阻",completed:"已完成",cancelled:"已取消"};
const statusKeys={"待办":"todo","进行中":"active","待确认":"confirm","受阻":"blocked","已完成":"completed","已取消":"cancelled"};
const runtimeLabels={none:"未登记",running:"运行中",waiting:"等待输入或审批",idle:"已停止",interrupted:"已中断",ended:"会话结束",stale:"状态过期",unknown:"状态未知"};
const recoveryLabels={none:"未触发",pending:"待发送",sent:"已发送"};
const controls=["keyword","status","boundary","priority","execution","execution-runtime","manager-runtime","recovery-state","task-type"].map(id=>document.getElementById(id));
const allColumns=["task_id","status","execution","execution_state","manager_state","recovery_state","priority","boundary","title","dependencies","executor","created_at","modified_at","detail_path"];
const defaultVisibleColumns=["task_id","status","execution_state","manager_state","priority","boundary","title","modified_at","detail_path"];
const columnToggles=[...document.querySelectorAll("[data-column-toggle]")];
const collator=new Intl.Collator("zh-CN",{numeric:true,sensitivity:"base"});
const relativeFormatter=new Intl.RelativeTimeFormat("zh-CN",{numeric:"always"});
const fullTimeFormatter=new Intl.DateTimeFormat("zh-CN",{dateStyle:"medium",timeStyle:"medium"});
const taskById=new Map();
const taskModal=document.getElementById("task-modal");
const embeddedStatus=document.getElementById('embedded-detail-status');
function showEmbeddedDetailStatus(message){

        element.target="_blank";

        element=document.createElement("a");element.href=new URL(target,location.href).href;element.textContent=match[1];element.target="_blank";element.rel="noopener";
      }else{
        element=document.createElement("span");
        element.className="md-local-path";
        element.append(document.createTextNode(match[1]));
        const code=document.createElement("code");
        code.textContent=target;
        element.append(code);
      }
    }else if(match[3]!==undefined){ element=document.createElement("code"); element.textContent=match[3]; }
    else if(match[4]!==undefined){ element=document.createElement("strong"); element.textContent=match[4]; }
    else { element=document.createElement("em"); element.textContent=match[5]; }
    parent.append(element);

let currentModalTaskId="";
function renderMarkdownDocument(source,container){
  container.replaceChildren();
  const lines=source.split(/\r?\n/);
  let list=null,listType="";
  for(let index=0;index<lines.length;index+=1){
    const line=lines[index].trim();
    if(!line){ list=null; listType=""; continue; }
    if(index===0&&/^#\s/.test(line)) continue;
    if(/^```/.test(line)){
      const code=[];
      while(++index<lines.length&&!/^```/.test(lines[index].trim())) code.push(lines[index]);
      const pre=document.createElement("pre");
      const content=document.createElement("code");
      content.textContent=code.join("\n");
      pre.append(content);
      container.append(pre);
      list=null; listType="";
      continue;
    }
    const heading=line.match(/^(#{1,6})\s+(.+)$/);
    if(heading){
      const level=Math.min(5,heading[1].length+1);
      const element=document.createElement(`h${level}`);
      appendMarkdownInline(element,heading[2]);
      container.append(element);
      list=null; listType="";
      continue;
    }
    if(/^---+$/.test(line)){ container.append(document.createElement("hr")); list=null; listType=""; continue; }
    if(/^\|.*\|$/.test(line)&&/^\|[\s:|-]+\|$/.test((lines[index+1]||"").trim())){
      const table=document.createElement("table"),head=document.createElement("thead"),body=document.createElement("tbody");
      const row=document.createElement("tr");
      for(const cell of line.slice(1,-1).split("|")){ const th=document.createElement("th"); appendMarkdownInline(th,cell.trim()); row.append(th); }
      head.append(row);
      index+=1;
      while(index+1<lines.length&&/^\|.*\|$/.test(lines[index+1].trim())){
        index+=1;
        const cells=document.createElement("tr");
        for(const cell of lines[index].trim().slice(1,-1).split("|")){ const td=document.createElement("td"); appendMarkdownInline(td,cell.trim()); cells.append(td); }
        body.append(cells);
      }
      table.append(head,body); container.append(table); list=null; listType=""; continue;
    }
    const bullet=line.match(/^([-*]|\d+\.)\s+(.+)$/);
    if(bullet){
      const kind=/\d/.test(bullet[1])?"ol":"ul";
      if(!list||listType!==kind){ list=document.createElement(kind); container.append(list); listType=kind; }
      const item=document.createElement("li"); appendMarkdownInline(item,bullet[2]); list.append(item); continue;
    }
    list=null; listType="";
    if(/^>\s?/.test(line)){
      const quote=document.createElement("blockquote"),paragraph=document.createElement("p");
      appendMarkdownInline(paragraph,line.replace(/^>\s?/,"")); quote.append(paragraph); container.append(quote); continue;
    }
    const paragraph=document.createElement("p");
    appendMarkdownInline(paragraph,line);
    container.append(paragraph);
  }
}

async function refreshTasks(force=false){
  try{
    const sourceUrl=new URL("TASKS.csv",location.href);
    sourceUrl.searchParams.set("_",String(Date.now()));
    const response=await fetch(sourceUrl,{cache:"no-store"});
    if(!response.ok) throw new Error(`HTTP ${response.status}`);
    const source=await response.text();
    let runtimeSource="";
    runtimeObservationWarning="";
    try{
      const runtimeUrl=new URL("session-runtime.csv",location.href);
      runtimeUrl.searchParams.set("_",String(Date.now()));
      const runtimeResponse=await fetch(runtimeUrl,{cache:"no-store"});
      if(!runtimeResponse.ok) throw new Error(`HTTP ${runtimeResponse.status}`);
      runtimeSource=await runtimeResponse.text();
      runtimeSessions=runtimeFromCsv(runtimeSource);
    }catch(error){
      runtimeSessions=new Map();
      runtimeObservationWarning=`会话观察不可用（${error.message}）`;
    }
    scheduleRuntimeExpiry();
    const signature=`${source}\n--runtime--\n${runtimeSource}`;
    if(force||signature!==lastDataSignature){
      tasks=tasksFromCsv(source);
      applyRuntimeObservation();
      lastDataSignature=signature;
      taskById.clear();
      tasks.forEach(task=>taskById.set(task.task_id,task));
      syncTaskOptions();
      render();
      updateConfirmNotifications();
      const requestedTask=new URL(location.href).searchParams.get("task");
      if(!requestedTaskOpened&&requestedTask&&taskById.has(requestedTask)){requestedTaskOpened=true;void openTaskModal(requestedTask);}
      else if(embeddedDetail&&!taskById.has(requestedTask))showEmbeddedDetailStatus('任务不存在或已从项目中移除。');
    }
  }catch(error){
      if(embeddedDetail)showEmbeddedDetailStatus(`任务详情读取失败：${error.message}`);
    document.getElementById("result").textContent=`读取 TASKS.csv 失败：${error.message}`;
  }
}
function scheduleRuntimeExpiry(){
  clearTimeout(runtimeExpiryTimer);
  const now=Date.now();
  const deadlines=[...runtimeSessions.values()].map(session=>{
    const observed=Date.parse(session.last_seen_at||session.status_at);
    const lifetime=["running","waiting"].includes(session.status)?30*60_000:24*60*60_000;
    return observed+lifetime;
  }).filter(deadline=>Number.isFinite(deadline)&&deadline>now);
  if(!deadlines.length) return;
  runtimeExpiryTimer=setTimeout(()=>{
    applyRuntimeObservation();
    render();
    scheduleRuntimeExpiry();
  },Math.min(...deadlines)-now+20);
}

function updatePermissionPrompt(feedback=""){
  const supported="Notification" in window;

  notificationPermission.hidden=served&&supported&&window.isSecureContext&&permission==="granted"&&!message;
  enableNotifications.hidden=!served||!supported||!window.isSecureContext||permission!=="default";
  if(!served){ notificationPermissionText.textContent="本地文件无法可靠申请浏览器通知。请通过工作台的项目内看板链接，以 http://127.0.0.1 或 http://localhost 地址打开。"; return; }
  if(!supported){ notificationPermissionText.textContent="当前浏览器不支持桌面通知。"; return; }
  if(!window.isSecureContext){ notificationPermissionText.textContent="当前地址不支持通知权限，请使用 HTTPS 或本机 http://127.0.0.1、http://localhost 地址打开看板。"; return; }
  if(permission==="denied"){
    notificationPermissionText.textContent="浏览器已阻止此站点通知。请点击地址栏左侧的站点信息，将通知设为允许，然后刷新页面。";

function updateConfirmNotifications(){
  if(embeddedDetail)return;
  const current=new Set(tasks.filter(task=>task.status==="待确认").map(task=>task.task_id));
  try{
    const saved=JSON.parse(localStorage.getItem(notifiedConfirmKey)||"[]");
    notifiedConfirmIds=new Set(Array.isArray(saved)?saved:[]);
  }catch(error){ notifiedConfirmIds=new Set(); }
  notifiedConfirmIds=new Set([...notifiedConfirmIds].filter(id=>current.has(id)));
  if(/^https?:$/.test(location.protocol)&&window.isSecureContext&&"Notification" in window&&Notification.permission==="granted"){
    const fresh=[...current].filter(id=>!notifiedConfirmIds.has(id));
    if(fresh.length){
      try{
        const notice=new Notification(fresh.length===1?`${fresh[0]} 待确认`:`${fresh.length} 项任务待确认`,{
          body:fresh.slice(0,5).join("、")+(fresh.length>5?` 等 ${fresh.length} 项`:""),
          tag:`task-dashboard-confirm:${location.pathname}`,
        });
        notificationDeliveryFeedback="";
        notice.onerror=event=>{
          // 构造成功不等于投递成功；失败后撤销本次去重，下一次数据更新可重试。
          try{
            const saved=JSON.parse(localStorage.getItem(notifiedConfirmKey)||"[]");
            notifiedConfirmIds=new Set(Array.isArray(saved)?saved:[]);
          }catch(error){}
          fresh.forEach(id=>notifiedConfirmIds.delete(id));
          try{ localStorage.setItem(notifiedConfirmKey,JSON.stringify([...notifiedConfirmIds])); }catch(error){}
          reportNotificationFailure(event.error);
        };
        notice.onclick=()=>{
          window.focus();
          document.getElementById("execution").value="confirm";
          render();
          persistDashboardState();
        };
        fresh.forEach(id=>notifiedConfirmIds.add(id));
      }catch(error){ reportNotificationFailure(error); }
    }
  }
  try{ localStorage.setItem(notifiedConfirmKey,JSON.stringify([...notifiedConfirmIds])); }catch(error){}
  updatePermissionPrompt();
}

document.getElementById("task-modal-close").addEventListener("click",()=>requestTaskDetailClose());
taskModal.addEventListener("close",()=>{ taskModalRequest+=1; document.body.classList.remove("task-modal-open"); });
taskModal.addEventListener("click",event=>{ if(event.target===taskModal) taskModal.close(); });
document.addEventListener("keydown",event=>{ if(event.key==="Escape") hideGraphCard(true); });
document.addEventListener("pointerdown",event=>{
  if(graphCardPinned&&!graphTaskCard.contains(event.target)&&!event.target.closest(".graph-node")) hideGraphCard(true);
});
document.querySelector(".graph-scroll").addEventListener("scroll",positionGraphCard);
window.addEventListener("scroll",positionGraphCard,{passive:true});
window.addEventListener("resize",positionGraphCard);
document.addEventListener("visibilitychange",updateRelativeTimes);
setInterval(updateRelativeTimes,1000);
setDependencyGraphExpanded(true,false);
syncColumnControls();
updatePermissionPrompt();
void refreshTasks(true).then(()=>{ restoreDashboardState(); render(); connectUpdates(); });
</script>
</body>
</html>
